# Creates a release: works out the next version from the newest tag, tags the
# tip of the chosen branch with it and publishes a release.
#
# Run it from Actions > "Create release" > Run workflow, or from a script
# with `gh workflow run release.yml -f branch=main -f release_type=minor`.
#
#   Branch        the branch to release from (default main)
#   Release type  patch (default), minor or major. With 2.0.1 as the newest
#                 tag: patch -> 2.0.2, minor -> 2.1.0, major -> 3.0.0
#
# Tags are plain x.y.z (no "v"), the form jsDelivr and the subject sites use
# (subject.json "uiVersion": "2" follows the newest 2.x.x). Patch and minor
# releases reach every subject site at once, so they must stay backward
# compatible; anything breaking is a major (see README.md). The release title
# is "<new tag> - <subject of the branch's last commit>". The release notes
# are generated by GitHub from the changes since the previous tag.
#
# The run stops, and creates nothing, when no x.y.z tag exists yet, when the
# branch has no commits since the newest tag, or when the new tag exists.
#
# After a release, subject sites on a major range ("uiVersion": "2") may take
# minutes to hours to see it because jsDelivr caches the range. See "Release a
# version" in README.md for the purge links.
name: Create release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to create the release from
        type: string
        default: main
        required: true
      release_type:
        description: Which part of the version to raise
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the new tag
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          # The newest tag that looks like x.y.z (other tags are ignored).
          last=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                 | sort -V | tail -n 1 || true)
          if [ -z "$last" ]; then
            echo "::error::No tag like 2.0.1 exists yet; create the first tag by hand."
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$last"
          case "$RELEASE_TYPE" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown release type '$RELEASE_TYPE'"; exit 1 ;;
          esac

          if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "::error::Tag $new already exists."
            exit 1
          fi

          # Nothing to release if the branch has no commit after the tag.
          if [ "$(git rev-list --count "$last..HEAD")" -eq 0 ]; then
            echo "::error::No commits since $last on this branch; nothing to release."
            exit 1
          fi

          echo "Last tag $last -> new tag $new ($RELEASE_TYPE)"
          {
            echo "last=$last"
            echo "new=$new"
            echo "sha=$(git rev-parse HEAD)"
            echo "subject=$(git log -1 --format=%s)"
          } >> "$GITHUB_OUTPUT"

      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.version.outputs.last }}
          NEW: ${{ steps.version.outputs.new }}
          SHA: ${{ steps.version.outputs.sha }}
          SUBJECT: ${{ steps.version.outputs.subject }}
        run: |
          set -euo pipefail

          # --target makes GitHub create the tag at this exact commit.
          gh release create "$NEW" \
            --target "$SHA" \
            --title "$NEW - $SUBJECT" \
            --generate-notes \
            --notes-start-tag "$LAST" \
            --latest

          {
            echo "### Released $NEW"
            echo
            echo "- Previous tag: \`$LAST\`"
            echo "- Commit: \`$SHA\` - $SUBJECT"
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$NEW"
          } >> "$GITHUB_STEP_SUMMARY"
